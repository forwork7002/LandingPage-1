name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Faqat statik sayt fayllari publish qilinadi.
      # server.js, start.sh, sinolife-landing.service — chiqarilmaydi.
      - name: Sayt papkasini yigʻish
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r img _site/
          touch _site/.nojekyll

      # og:image / og:url absolyut boʻlishi shart (Facebook, Telegram preview uchun),
      # lekin ular repo/domenga bogʻliq. Shuning uchun deploy paytida
      # haqiqiy Pages manzili bilan almashtiriladi — index.html ikkala repoda
      # bir xil qoladi, custom domain ulansa ham oʻzi moslashadi.
      - name: og-teglarni sayt manziliga moslash
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 - <<'PY'
          import os, re, io
          base = os.environ['BASE_URL'].rstrip('/') + '/'
          p = '_site/index.html'
          s = io.open(p, encoding='utf-8').read()
          s, n1 = re.subn(r'(<meta property="og:image" content=")[^"]*(")',
                          lambda m: m.group(1) + base + 'img/og.jpg' + m.group(2), s)
          s, n2 = re.subn(r'(<meta property="og:url" content=")[^"]*(")',
                          lambda m: m.group(1) + base + m.group(2), s)
          io.open(p, 'w', encoding='utf-8').write(s)
          print(f'base={base}  og:image={n1}  og:url={n2}')
          if not (n1 and n2):
              raise SystemExit('og teglari topilmadi — index.html oʻzgargan boʻlishi mumkin')
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
